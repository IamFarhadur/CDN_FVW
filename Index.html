<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .card {
      width: min(90%, 520px);
      padding: 60px 40px;
      text-align: center;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.06);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #111;
      color: #fff;
      font-size: 26px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    p {
      color: #777;
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">✦</div>
    <h1>Welcome</h1>
    <p>Simple things, beautifully made.</p>
  </div>
</body>
</html>
